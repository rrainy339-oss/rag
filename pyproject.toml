[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Enterprise RAG project, starting with local ingestion and Docling-based parsing."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
]
auth = [
    "PyJWT[crypto]>=2.8",
]
parsing = [
    "docling>=2.0",
]
indexing = [
    "qdrant-client>=1.10",
    "FlagEmbedding>=1.3.0",
]
reranking = [
    "FlagEmbedding>=1.3.0",
    "sentence-transformers>=5.0",
    "httpx>=0.28",
]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
